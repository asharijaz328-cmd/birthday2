name: Build Anti-Screenshot Android App (APK)

on:
  push:
    paths:
      - 'android-app/**'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build APK with FLAG_SECURE
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle 8.4
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.4"

      - name: Build APK with Gradle
        run: |
          cd android-app
          gradle assembleDebug --no-daemon --stacktrace

      - name: Rename APK
        run: |
          cp android-app/app/build/outputs/apk/debug/app-debug.apk ahsan.apk

      - name: Upload APK as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ahsan-app
          path: ahsan.apk

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: ahsan.apk
          tag_name: app-v1.2
          name: "ahsan v1.2 (Photo Icon & Developer Bypass)"
          body: |
            ### 🛑 Anti-Screenshot Android App Ready!
            - **App Name:** ahsan
            - **App Icon:** Customized with Ahsan's official portrait photo
            - **Developer Bypass:** Added Developer Mode prompt (Key: `houseno328`)
            - **Screenshot Blocked:** Phone displays `Can't take screenshot due to security policy`.
            - **Screen Recording Blocked:** Screen recorder captures only black screen.
            
            📲 **Download & Install:**
            Download `ahsan.apk` below and install on Android!
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

