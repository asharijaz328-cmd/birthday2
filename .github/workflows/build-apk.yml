name: Build Anti-Screenshot Android App (APK)

on:
  push:
    paths:
      - 'android-app/**'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build APK with FLAG_SECURE
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Generate Gradle Wrapper & Build APK
        run: |
          cd android-app
          # Install gradle wrapper if gradlew is not present
          gradle wrapper --gradle-version 8.4 --distribution-type bin
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Rename APK
        run: |
          cp android-app/app/build/outputs/apk/debug/app-debug.apk Ahsan-Birthday-AntiScreenshot.apk

      - name: Upload APK as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Ahsan-Birthday-AntiScreenshot-App
          path: Ahsan-Birthday-AntiScreenshot.apk

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: Ahsan-Birthday-AntiScreenshot.apk
          tag_name: app-v1.0
          name: "Ahsan Birthday App (Anti-Screenshot) v1.0 🎂"
          body: |
            ### 🛑 Anti-Screenshot Android App Ready!
            - **Screenshot Blocked:** Phone displays `Can't take screenshot due to security policy`.
            - **Screen Recording Blocked:** Screen recorder captures only black screen.
            - **App Switcher Protection:** Recent apps overview is protected.
            
            📲 **Download & Install:**
            Download `Ahsan-Birthday-AntiScreenshot.apk` below and send to Ahsan on WhatsApp!
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
